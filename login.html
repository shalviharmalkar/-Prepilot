<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login — PrepPilot AI</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="auth-shell"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PrepPilot
                <b>AI</b></span></a>
        <div class="auth-card">
            <div class="auth-title"><span class="eyebrow">WELCOME BACK</span>
                <h1>Sign in to your cockpit</h1>
                <p>Continue your interview preparation journey.</p>
            </div>
            <form id="loginForm"><label>Email<input id="loginEmail" type="email" placeholder="you@example.com"
                        required></label><label>Password<input type="password" placeholder="••••••••" required></label>
                <div class="form-row"><label class="check"><input type="checkbox"> Remember me</label><a href="#">Forgot
                        password?</a></div><button class="btn btn-primary full">Sign In</button>
            </form>
            <div class="divider">or</div><a class="btn btn-light full" href="register.html">Create a new account</a>
            <p class="demo-note">Demo login: any valid email + password</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
