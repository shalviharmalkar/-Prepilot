<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Register — PrepPilot AI</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="auth-shell"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PrepPilot
                <b>AI</b></span></a>
        <div class="auth-card">
            <div class="auth-title"><span class="eyebrow">CREATE PROFILE</span>
                <h1>Start your preparation</h1>
                <p>Your account connects resumes, roles and interview sessions.</p>
            </div>
            <form id="registerForm">
                <div class="two"><label>Full name<input id="regName" placeholder="Your name"
                            required></label><label>Role<input id="regRole" placeholder="e.g. Frontend Developer"
                            required></label></div><label>Email<input id="regEmail" type="email"
                        placeholder="you@example.com" required></label><label>Password<input type="password"
                        placeholder="Create password" required></label><button class="btn btn-primary full">Create
                    Account</button>
            </form>
            <p class="center">Already registered? <a href="login.html">Sign in</a></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
